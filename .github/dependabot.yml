version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - github-actions
